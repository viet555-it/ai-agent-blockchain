[project]
name = "ai-agent-blockchain"
version = "0.1.0"
description = "AI Agent with Blockchain Tools – LLM agent that reads on-chain data and executes transactions via guardrail-controlled tools."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Blockchain
    "web3>=7.0,<8.0",
    # Schema / Config
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "filelock>=3.0",
    "pyyaml>=6.0",
    # Token counting
    "tiktoken>=0.8",
    # LLM providers
    "google-genai>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
    # HTTP (for Etherscan, etc.)
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pytest-cov>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "sepolia: tests that require Sepolia RPC connection (deselect with '-m \"not sepolia\"')",
]

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "services*", "security*", "config*"]

[tool.coverage.run]
omit = [
    # LLM adapters need real API keys – tested manually / in integration
    "agent/llm/gemini.py",
    "agent/llm/anthropic.py",
    "agent/llm/openai_adapter.py",
    # Web3 implementation needs real RPC connection
    "services/blockchain.py",
    # Etherscan needs API key
    "services/etherscan.py",
    # Service factory wires real dependencies
    "agent/service.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
