# Tool enable/disable configuration
# Only tools listed under 'enabled' are available to the agent.
# Remove a tool from this list to disable it.

enabled:
  # ── READ tools (run freely) ──────────────────────────────
  - get_native_balance
  - get_erc20_balance
  - get_token_info
  - get_transaction
  - get_transaction_history   # Requires ETHERSCAN_API_KEY; graceful error if missing
  - get_block
  - get_gas_price
  - estimate_gas
  - read_contract

  # ── WRITE tools (require guardrail + confirmation) ───────
  - transfer_native
  - transfer_erc20
  - call_contract
